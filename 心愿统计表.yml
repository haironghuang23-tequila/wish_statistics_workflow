    - data:
        code: "import json\n\ndef main(text, ocr, doc_text, period):\n    msgs = []\n\
          \    if doc_text and str(doc_text).strip():\n        for s in parse_md_table(str(doc_text)):\n\
          \            if s:\n                msgs.append({\"text\": s, \"source\"\
          : \"Excel导入\"})\n    if ocr and str(ocr).strip():\n        for line in [str(ocr).strip()]:\n\
          \            line = line.strip()\n            if line:\n               \
          \ msgs.append({\"text\": line, \"source\": \"照片\"})\n    if text and str(text).strip():\n\
          \        for line in str(text).splitlines():\n            line = line.strip()\n\
          \            if line:\n                msgs.append({\"text\": line, \"source\"\
          : \"手动文字\"})\n    chunks = []\n    for i in range(0, len(msgs), 20):\n \
          \       chunks.append(json.dumps(msgs[i:i+20], ensure_ascii=False))\n  \
          \  if not chunks:\n        chunks = [json.dumps([], ensure_ascii=False)]\n\
          \    if any(m[\"source\"] == \"Excel导入\" for m in msgs):\n        source\
          \ = \"Excel导入\"\n    elif any(m[\"source\"] == \"照片\" for m in msgs):\n\
          \        source = \"照片\"\n    else:\n        source = \"手动文字\"\n    return\
          \ {\"chunks\": chunks, \"source\": source, \"count\": len(msgs)}\n\ndef\
          \ split_row(l):\n    parts = l.split(\"|\")\n    if parts and parts[0].strip()\
          \ == \"\":\n        parts = parts[1:]\n    if parts and parts[-1].strip()\
          \ == \"\":\n        parts = parts[:-1]\n    return parts\n\ndef parse_md_table(t):\n\
          \    lines = [l.strip() for l in t.splitlines() if l.strip()]\n    header_idx\
          \ = None\n    for i, l in enumerate(lines):\n        if l.startswith(\"\
          |\") and \"|\" in l[1:]:\n            header_idx = i\n            break\n\
          \    if header_idx is None:\n        return [l for l in lines]\n    target\
          \ = None\n    for j, c in enumerate(split_row(lines[header_idx])):\n   \
          \     if c.strip() in (\"心愿描述\", \"心愿\", \"描述\"):\n            target =\
          \ j\n    start = header_idx + 1\n    if start < len(lines):\n        sep\
          \ = lines[start].replace(\"|\", \"\").replace(\"-\", \"\").replace(\":\"\
          , \"\").replace(\" \", \"\")\n        if sep == \"\":\n            start\
          \ += 1\n    out = []\n    for l in lines[start:]:\n        if not l.startswith(\"\
          |\"):\n            continue\n        cs = split_row(l)\n        if target\
          \ is not None and target < len(cs):\n            v = cs[target].strip()\n\
          \            if v:\n                out.append(v)\n        else:\n     \
          \       row = \" \".join(x.strip() for x in cs if x.strip())\n         \
          \   if row:\n                out.append(row)\n    return out"
        code_language: python3
