    - data:
        code: "import json\nimport re\nimport datetime\nfrom collections import Counter,\
          \ defaultdict\n\nCATS = [\"洗护用品\", \"鞋服\", \"食品保健\", \"美妆护肤\", \"百货\", \"\
          数码家电\", \"箱包\"]\n\ndef to_period(p):\n    s = (p or '').strip()\n    if\
          \ re.match(r'^\\d{1,2}\\.\\d{1,2}-\\d{1,2}\\.\\d{1,2}$', s):\n        return\
          \ s\n    y = mo = dd = None\n    m = re.match(r'^(\\d{4})[-/.](\\d{1,2})[-/.](\\\
          d{1,2})', s)\n    if m:\n        y, mo, dd = int(m.group(1)), int(m.group(2)),\
          \ int(m.group(3))\n    else:\n        m2 = re.match(r'^(\\d{1,2})[-/.](\\\
          d{1,2})$', s)\n        if m2:\n            mo, dd = int(m2.group(1)), int(m2.group(2))\n\
          \            y = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).year\n\
          \    if not mo and not s:\n        now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))\n\
          \        y, mo, dd = now.year, now.month, now.day\n    if mo:\n        days\
          \ = [31,28,31,30,31,30,31,31,30,31,30,31]\n        if mo == 2 and ((y %\
          \ 4 == 0 and y % 100 != 0) or y % 400 == 0):\n            days[1] = 29\n\
          \        if dd <= 15:\n            return '%d.1-%d.15' % (mo, mo)\n    \
          \    return '%d.16-%d.%d' % (mo, mo, days[mo-1])\n    return s or '未命名'\n\
          \ndef extract_json(raw):\n    if not isinstance(raw, str):\n        return\
          \ raw\n    s = raw.strip()\n    fence = re.search(r'```(?:json)?\\s*(.*?)```',\
          \ s, re.S)\n    if fence:\n        s = fence.group(1).strip()\n    try:\n\
          \        return json.loads(s)\n    except Exception:\n        pass\n   \
          \ s = re.sub(r'<think\\b[^>]*>.*?</think>', '', s, flags=re.S)\n    s =\
          \ s.replace('<!--dify-deepseek-reasoning-->', '')\n    first, last = s.find('['),\
          \ s.rfind(']')\n    if first != -1 and last > first:\n        try:\n   \
          \         return json.loads(s[first:last+1])\n        except Exception:\n\
          \            pass\n    first, last = s.find('{'), s.rfind('}')\n    if first\
          \ != -1 and last > first:\n        try:\n            return json.loads(s[first:last+1])\n\
          \        except Exception:\n            pass\n    return None\n\ndef _canon(name):\n\
          \    s = (name or '').strip()\n    if '格里高利' in s:\n        s = s.replace('gregory',\
          \ '').replace('GREGORY', '')\n    for w in ['男女同款', '徒步登山', '同款', '户外',\
          \ '的']:\n        s = s.replace(w, '')\n    s = re.sub(r'\\s*(苔藓绿|黑色|白色|粉色|蓝色|绿色|红色|灰色|米色|棕色|黄色|紫色|橙色)\\\
          s*', ' ', s)\n    s = re.sub(r'\\s*\\d+(?:\\.\\d+)?\\s*(?:L|升|ml|ML|cm|CM|寸|码)',\
          \ ' ', s)\n    s = re.sub(r'\\s+', ' ', s).strip()\n    return s\n\ndef\
          \ _add_item(cnt, name, cat):\n    name = _canon(name)\n    cat = (cat or\
          \ '').strip()\n    if name and cat in CATS:\n        cnt[(name, cat)] +=\
          \ 1\n\ndef main(batches, period, source):\n    cnt = Counter()\n    for\
          \ b in (batches or []):\n        arr = extract_json(b)\n        if arr is\
          \ None:\n            continue\n        if isinstance(arr, dict):\n     \
          \       arr = [arr]\n        if not isinstance(arr, list):\n           \
          \ continue\n        for row in arr:\n            if not isinstance(row,\
          \ dict):\n                continue\n            items = row.get('items')\n\
          \            if items is None:\n                _add_item(cnt, row.get('name')\
          \ or row.get('text'), row.get('category'))\n                continue\n \
          \           for it in items:\n                if isinstance(it, dict):\n\
          \                    _add_item(cnt, it.get('name') or it.get('text'), it.get('category'))\n\
          \    by = defaultdict(list)\n    for (name, cat), n in cnt.items():\n  \
          \      by[cat].append((name, n))\n    for cat in by:\n        by[cat].sort(key=lambda\
          \ x: (-x[1], x[0]))\n    maxrows = max([len(by[c]) for c in CATS] + [1])\n\
          \    header = []\n    for c in CATS:\n        header += [c, \"许愿人次\"]\n\
          \    rows = [header]\n    for i in range(maxrows):\n        r = []\n   \
          \     for c in CATS:\n            if i < len(by[c]):\n                r\
          \ += [by[c][i][0], by[c][i][1]]\n            else:\n                r +=\
          \ [\"\", \"\"]\n        rows.append(r)\n    while len(rows) < 121:\n   \
          \     rows.append([\"\"] * 14)\n    total = sum(cnt.values())\n    kinds\
          \ = len(cnt)\n    sn = to_period(period)\n    body_range = \"A1:N%d\" %\
          \ len(rows)\n    header_only = \"A1:N1\"\n    table_url = \"https://my.feishu.cn/sheets/QlJTseUX6h1mDFtX0NeclW8rn2h\"\
          \n    summary = \"半月周期：%s\\n物品种类：%d\\n总许愿人次：%d\\n统计表：%s\" % (sn, kinds,\
          \ total, table_url)\n    return {\n        \"values_json\": json.dumps(rows,\
          \ ensure_ascii=False),\n        \"body_range\": body_range,\n        \"\
          header_only\": header_only,\n        \"sheet_title\": sn,\n        \"table_url\"\
          : table_url,\n        \"summary\": summary,\n        \"total\": total,\n\
          \        \"kinds\": kinds,\n    }\n"
