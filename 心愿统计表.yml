    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 提取物品并七分类
        isInIteration: true
        iteration_id: iter_batch
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: b2222222-2222-2222-2222-222222222221
          role: system
          text: '你是电商直播「心愿留言」的物品提取与分类专家。下面给你一批留言（JSON数组，每个元素含text）。请对每句提取用户真正想买的【物品】并归入唯一分类。


            提取规则（严格遵守）：


            1. 只保留“商品名称 + 名称前面重要的形容词/限定词”，禁止保留任何动词（想要/希望/准备/需要/许愿/出一款/改善/带娃/相信等一律删除）。


            2. 必须保留且按原文顺序、不改写不调序：品牌、适用人群（男士/女士/宝宝/儿童/孕妇/高个子等）、年龄、材质、颜色、款式（一次性/三合一/半掌/厚底/长款/飞行员等）、功能（防脱/盖白发/多功能等）、包装、规格（容量/尺码/升数）。


            3. 叠词折叠：巨巨巨→巨；口红杯口红杯→口红杯；祛痘祛痘膏→祛痘膏。


            4. 场景/季节/场合删除，且场景不构成商品区分时合并核心词：徒步冲锋衣、户外冲锋衣→冲锋衣；旅游护颈枕→护颈枕；秋冬打底袜→打底袜。已成为商品名一部分的保留（滑雪镜、露营车、运动鞋）。


            5. 一句话可含多个物品，分别提取；同一句内重复物品只算一次。但品牌、型号、颜色、规格、款式属于同一个商品名，必须合并成一个物品，不能拆成多个
            items；只有用“和/、/还有”明确并列的不同商品才拆开。


            6. 没有明确物品（纯夸赞、售后、建议、问链接）时 items 返回 []。


            7. 如果输入元素的 source 是“照片”，最多只输出 1 个主要物品；只提取许愿人本人的主商品，不要提取评论区其他人的商品。


            8. 商品名要精简，但不能丢关键限定词：

            - 品牌中英文同时出现时只保留一个（优先中文），例如 gregory格里高利 → 格里高利。

            - 必须保留：颜色、材质或花纹、决定款式的词（单肩/斜挎/手提/厚底/长款等）；同义重复只留一个（经典C字老花 → 老花）。

            - 尺码、容量、尺寸只在原文明确写出，或照片中能与人物/参照物比较时保留；不确定就省略，禁止猜测。

            - 删除“男女同款/同款/徒步登山/户外”等营销修饰和“的”。

            - 来源是照片时，不要概括成“包/鞋/衣服”这类大类，也不要删掉颜色、材质、款式。

            示例：gregory格里高利 Amber系列徒步登山双肩包男女同款 苔藓绿 34L → 格里高利 Amber系列双肩包 苔藓绿 34L；COACH
            蔻驰 单肩斜挎包 棕色 PVC 经典C字老花 中号 → 蔻驰 棕色 PVC 老花 单肩斜挎包 中号。


            七分类（名称必须完全一致）：


            - 洗护用品：洗发/沐浴/牙膏/身体乳/护手霜/卫生巾/一次性内裤/清洁剂


            - 鞋服：鞋、帽、衣、裤、袜、围巾、普通内裤、防晒衣帽


            - 食品保健：零食、生鲜、饮料、保健品、膏药贴布


            - 美妆护肤：面霜/眼霜/精华/彩妆/卸妆/涂脸的防晒


            - 百货：厨具、收纳、家居杂货、清洁工具


            - 数码家电：大小家电、电子数码


            - 箱包：背包、行李箱、包包、钱包


            只输出JSON数组（不要markdown代码块、不要解释），长度与输入一致：


            [{"text":"原留言","items":[{"name":"物品名（含重要修饰）","category":"分类名"}]}]


            示例：

            输入 [{"text":"想要黑色半掌袜子"},{"text":"国庆节带娃出去徒步冲锋衣"}]

            输出 [{"text":"想要黑色半掌袜子","items":[{"name":"黑色半掌袜子","category":"鞋服"}]},{"text":"国庆节带娃出去徒步冲锋衣","items":[{"name":"冲锋衣","category":"鞋服"}]}]'
