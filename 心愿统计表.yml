    - data:
        code: "import json\nfrom collections import Counter, defaultdict\n\nCATS =\
          \ [\"洗护用品\", \"鞋服\", \"食品保健\", \"美妆护肤\", \"百货\", \"数码家电\", \"箱包\"]\n\ndef\
          \ ingest(grid, cnt):\n    if not grid:\n        return\n    for r in grid[1:]:\n\
          \        if not isinstance(r, list):\n            continue\n        for\
          \ i, cat in enumerate(CATS):\n            nc = i * 2\n            cc = i\
          \ * 2 + 1\n            if nc < len(r):\n                name = r[nc]\n \
          \               if name is not None and str(name).strip():\n           \
          \         v = r[cc] if cc < len(r) else \"\"\n                    try:\n\
          \                        n = int(float(v)) if v not in (\"\", None) else\
          \ 1\n                    except Exception:\n                        n =\
          \ 1\n                    cnt[(str(name).strip(), cat)] += n\n\ndef build(cnt):\n\
          \    by = defaultdict(list)\n    for (name, cat), n in cnt.items():\n  \
          \      by[cat].append((name, n))\n    for cat in by:\n        by[cat].sort(key=lambda\
          \ x: (-x[1], x[0]))\n    maxrows = max([len(by[c]) for c in CATS] + [1])\n\
          \    header = []\n    for c in CATS:\n        header += [c, \"许愿人次\"]\n\
          \    rows = [header]\n    for i in range(maxrows):\n        rr = []\n  \
          \      for c in CATS:\n            if i < len(by[c]):\n                rr\
          \ += [by[c][i][0], by[c][i][1]]\n            else:\n                rr +=\
          \ [\"\", \"\"]\n        rows.append(rr)\n    return rows\n\ndef main(new_values,\
          \ read_body):\n    cnt = Counter()\n    try:\n        ingest(json.loads(new_values),\
          \ cnt)\n    except Exception:\n        pass\n    try:\n        b = json.loads(read_body)\
          \ if isinstance(read_body, str) else read_body\n        old = (b.get(\"\
          data\", {}).get(\"valueRange\", {}) or {}).get(\"values\", [])\n       \
          \ ingest(old, cnt)\n    except Exception:\n        pass\n    rows = build(cnt)\n\
          \    return {\n        \"values_json\": json.dumps(rows, ensure_ascii=False),\n\
          \        \"body_range\": \"A1:N%d\" % len(rows),\n        \"header_only\"\
          : \"A1:N1\",\n        \"rows_n\": len(rows),\n    }"
        code_language: python3
